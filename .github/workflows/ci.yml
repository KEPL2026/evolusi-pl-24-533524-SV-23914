name: CI CD Laravel Catering

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
      - 'fix/**'

  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Mengambil source code
        uses: actions/checkout@v4

      - name: Menyiapkan PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Memeriksa Composer
        run: composer validate --no-check-publish

      - name: Menginstal dependency
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Memeriksa Laravel
        run: php artisan --version


  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Mengambil source code
        uses: actions/checkout@v4

      - name: Menyiapkan PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Menginstal dependency
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Menyiapkan environment testing
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Menjalankan migration
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate --force

      - name: Menjalankan pengujian Laravel
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test


  staging:
    name: Staging
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Mengambil source code
        uses: actions/checkout@v4

      - name: Menyiapkan PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Menginstal dependency
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Menyiapkan environment staging
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Menjalankan migration staging
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate --force

      - name: Memeriksa gaya kode
        run: ./vendor/bin/pint --test

      - name: Memeriksa route Laravel
        run: php artisan route:list


  production:
    name: Production
    runs-on: ubuntu-latest
    needs: staging

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: catering_production
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Mengambil source code
        uses: actions/checkout@v4

      - name: Menyiapkan PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Membuat environment production
        run: |
          cat > .env <<'EOF'
          APP_NAME=Catering
          APP_ENV=production
          APP_KEY=
          APP_DEBUG=false
          APP_URL=http://localhost

          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=catering_production
          DB_USERNAME=root
          DB_PASSWORD=root

          CACHE_STORE=file
          SESSION_DRIVER=file
          QUEUE_CONNECTION=sync
          EOF

      - name: Menjalankan SSH Server
        run: |
          sudo mkdir -p /run/sshd
          sudo service ssh start

      - name: Menyiapkan SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys

          ssh-keyscan -H 127.0.0.1 >> ~/.ssh/known_hosts

      - name: Membuktikan secret disensor
        env:
          MASK_TEST: ${{ secrets.MASK_TEST }}
        run: |
          echo "Secret masking: $MASK_TEST"

      - name: Menguji koneksi SSH
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "$USER@127.0.0.1" \
            "echo 'Koneksi SSH berhasil'"

      - name: Menjalankan deploy.sh melalui SSH
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "$USER@127.0.0.1" \
            "cd '$GITHUB_WORKSPACE' && bash deploy.sh"